<script>
(function(){

// ----- DRAGGABLE ELEMENTS (unchanged) -----
const circle = document.getElementById("circle");
const panel = document.getElementById("panel");
const closeBtn = document.getElementById("closeBtn");
const result = document.getElementById("resultText");
const period = document.getElementById("periodText");
const timerText = document.getElementById("timerText");

function makeDraggable(el){
  let isDown = false, offsetX = 0, offsetY = 0;

  function start(e){
    isDown = true;
    const rect = el.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;
  }

  function move(e){
    if(!isDown) return;
    e.preventDefault();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    el.style.left = (clientX - offsetX) + "px";
    el.style.top = (clientY - offsetY) + "px";
  }

  function end(){ isDown = false; }

  el.addEventListener("mousedown", start);
  el.addEventListener("touchstart", start);
  document.addEventListener("mousemove", move);
  document.addEventListener("touchmove", move, { passive: false });
  document.addEventListener("mouseup", end);
  document.addEventListener("touchend", end);
}

makeDraggable(circle);
makeDraggable(panel);

// ----- OPEN / CLOSE (circle toggles panel) -----
circle.onclick = () => {
  panel.style.display = "block";
  // set panel position near circle (preserve left/top from computed style)
  const circleLeft = circle.style.left ? circle.style.left : "60px";
  const circleTop = circle.style.top ? parseInt(circle.style.top) : 140;
  panel.style.left = circleLeft;
  panel.style.top = (circleTop + 100) + "px";
  circle.style.display = "none";
};

closeBtn.onclick = () => {
  panel.style.display = "none";
  circle.style.display = "flex";
};

// ----- PERIOD LOGIC (Asia/Kolkata 5:29 AM Start) -----
let lastPeriod = "";

function updatePeriod(){
  const now = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Kolkata" }));

  const seconds = now.getSeconds();
  const remainingSeconds = 60 - seconds;

  const currentHour = now.getHours();
  const currentMinute = now.getMinutes();

  const startHour = 5;
  const startMinute = 29;

  let elapsedMinutes = (currentHour * 60 + currentMinute) - (startHour * 60 + startMinute);

  if (elapsedMinutes < 0) {
    elapsedMinutes = 0;
  }

  const yyyy = now.getFullYear();
  const mm = String(now.getMonth() + 1).padStart(2, "0");
  const dd = String(now.getDate()).padStart(2, "0");

  const periodNumber = "100001" + String(elapsedMinutes).padStart(4, "0");
  const finalPeriod = `${yyyy}${mm}${dd}${periodNumber}`;

  period.innerText = "Period: " + finalPeriod;
  timerText.innerText = `00:${String(remainingSeconds).padStart(2, "0")}`;

  if (finalPeriod !== lastPeriod) {
    lastPeriod = finalPeriod;

    const numbers = [9, 7, 6, 5, 4, 3, 2, 1, 0];
    let currentNumber = numbers[Math.floor(Math.random() * numbers.length)];
    let sizeType = (currentNumber >= 5) ? "BIG" : "SMALL";

    result.innerText = sizeType + " " + currentNumber;
    result.style.transform = "scale(1.2)";
    setTimeout(() => result.style.transform = "scale(1)", 200);
  }
}

setInterval(updatePeriod, 1000);
updatePeriod();

// ----- Ensure iframe covers full screen & background matches (already done) -----
// Also prevent iframe from capturing clicks on the draggable circle/panel.
// That's handled by z-index and pointer-events: auto on .modx-wrapper and .panel.
// We also add a small style to make sure iframe doesn't block pointer events on overlay elements.
const iframe = document.getElementById('webview-iframe');
iframe.style.pointerEvents = 'none';   // THIS IS CRITICAL: lets circle & panel work, but iframe won't get clicks.
// However user wants webview to be interactive normally? The request says "load full screen webview https://bdg7749.com/#/register?invitationCode=2144720673195 full html background me desgin same only webview add".
// I interpret: keep the exact design (circle + panel) and add a fullscreen webview in background. But webview must be visible and functional.
// Setting pointer-events:none makes it non-interactive, which is not desired for a webview. So we need a better approach.
// Instead: set iframe to be a block element behind the overlays via z-index.
// But we already have iframe container at same stacking context. We need to lower iframe z-index and ensure overlays have higher z-index AND are positioned.
// Since iframe is a replaced element, we must set its z-index low and ensure overlays are above.

// Quick fix: update CSS for fullscreen-webview and iframe to have lower z-index, and circle/panel have higher.
// Also make sure overlays are not children of iframe.

// Let's adjust manually via JS after load:
iframe.style.position = 'absolute';
iframe.style.zIndex = '1';
circle.style.zIndex = '1000';
panel.style.zIndex = '2000';

// Also the parent container might need reset
document.querySelector('.fullscreen-webview').style.position = 'absolute';
document.querySelector('.fullscreen-webview').style.top = '0';
document.querySelector('.fullscreen-webview').style.left = '0';
document.querySelector('.fullscreen-webview').style.zIndex = '1';
// Body should be relative to contain absolutes.
document.body.style.position = 'relative';
document.body.style.height = '100vh';
document.body.style.margin = '0';

// Circle and panel are already absolute, we just need to ensure they are not inside any iframe container (they are not).
// Good to go.

// Additionally, to make example.com actually clickable, we set pointer-events:auto on iframe but overlays must capture events on their area.
// The overlays (circle, panel) are above iframe because of zIndex. Clicks on overlays work. If you click outside overlays, the iframe gets the click.
// That's perfect: webview is interactive, overlays are draggable.

iframe.style.pointerEvents = 'auto';   // revert earlier test

// Ensure circle and panel are not accidentally transparent to pointer events.
circle.style.pointerEvents = 'auto';
panel.style.pointerEvents = 'auto';

})();
</script>
<!-- ensure background covers full viewport, body set to 100vh -->

  .fullscreen-webview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

  /* make circle and panel click-through-proof */

  /* Ensure iframe content can be interacted with outside overlay areas */
  iframe { pointer-events: auto; }
